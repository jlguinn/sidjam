# Legacy MySQL only: the catalog generator (tools/generate_catalog.sh) reads the
# sidtunes table from it when the HVSC release changes. The PHP web and mailhog
# services were retired with the PHP backend; prod is Lambda + DynamoDB (lambda/).
services:
  sidjam-db:
    image: mysql:8.0
    container_name: sidjam-db-1
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "siduser", "-pjam@sid2025"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: