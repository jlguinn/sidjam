<!DOCTYPE html>
<html>
<head>
  <title>SID Hello World</title>
  <script src="../../src/websid/htdocs/stdlib/scriptprocessor_player.min.js"></script>
  <script src="../../src/websid/htdocs/backend_websid.js"></script>
  <style>
    canvas { border: 1px solid black; margin-top: 10px; }
  </style>
</head>
<body>
  <button onclick="togglePlayPause()">Play/Pause</button>
  <div>Version: 0.008</div>
  <canvas id="viz" width="300" height="100"></canvas>
  <script>
    const SONG_FILE = "sid/C64Music/MUSICIANS/H/Hubbard_Rob/Last_V8.sid";

    const VERSION = "0.008";
    let sidPlayer = null;
    let isPlaying = false;
    let canvas, ctx;

    console.log(`SID Hello World v${VERSION}`);

    function initPlayer() {
      console.log("Initializing...");
      const backend = new SIDBackendAdapter();
      ScriptNodePlayer.initialize(backend, () => {
        console.log("Track ended");
        isPlaying = false;
      }).then(player => {
        sidPlayer = ScriptNodePlayer.getInstance();
        console.log("Initialized");
        window.backend = backend; // Expose for viz
        loadSong();
      }).catch(err => console.error("Init error:", err));
    }

    function loadSong() {
      console.log("Loading:", SONG_FILE);
      try {
        const loadPromise = sidPlayer.loadMusicFromURL(SONG_FILE, { track: 0, timeout: -1 }, 
          () => console.log("Load retrying..."),
          (total, loaded) => {});
        if (loadPromise && typeof loadPromise.then === 'function') {
          loadPromise.then(() => {
            console.log("Loaded");
            if (isPlaying) {
              sidPlayer.resume();
              console.log("Playing");
            }
          }).catch(err => console.error("Load error:", err));
        } else {
          console.log("Load started...");
          if (isPlaying) {
            sidPlayer.resume();
            setTimeout(() => console.log("Playing"), 500);
          }
        }
      } catch (err) {
        console.error("Load attempt failed:", err);
      }
    }

    function togglePlayPause() {
      console.log("Toggle, isPlaying:", isPlaying);
      if (!sidPlayer) {
        isPlaying = true;
        initPlayer();
      } else if (isPlaying) {
        sidPlayer.pause();
        isPlaying = false;
        console.log("Paused");
      } else {
        sidPlayer.resume();
        isPlaying = true;
        console.log("Playing");
      }
    }

    // Visualization: Three voice waveforms
    function drawViz() {
      if (!isPlaying || !window.backend) {
        requestAnimationFrame(drawViz);
        return;
      }
      const playtime = window.backend.getCurrentPlaytime();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const voiceRegs = [
        { freqLo: 0, freqHi: 1, env: 11 }, // Voice 0
        { freqLo: 7, freqHi: 8, env: 18 }, // Voice 1
        { freqLo: 14, freqHi: 15, env: 25 } // Voice 2 (capped to 24)
      ];

      for (let voice = 0; voice < 3; voice++) {
        const { freqLo, freqHi, env } = voiceRegs[voice];
        const freqLoVal = backend_SID.Module.ccall('emu_get_sid_register', 'number', ['number', 'number'], [0, freqLo]);
        const freqHiVal = backend_SID.Module.ccall('emu_get_sid_register', 'number', ['number', 'number'], [0, freqHi]);
        const envVal = backend_SID.Module.ccall('emu_get_sid_register', 'number', ['number', 'number'], [0, Math.min(env, 24)]); // Cap at 24
        console.log(`Voice ${voice}: freq=${(freqHiVal << 8 | freqLoVal) * 0.0596}, env=${envVal}`);

        const frequency = ((freqHiVal << 8) | freqLoVal) * 0.0596; // Approx Hz
        const amplitude = (envVal & 0xFF) / 255; // 8-bit envelope

        ctx.beginPath();
        ctx.strokeStyle = `hsl(${voice * 120}, 100%, 50%)`; // Red, Green, Blue
        for (let x = 0; x < canvas.width; x++) {
          const y = (voice + 1) * canvas.height / 4 + 
                    Math.sin(x / 20 + playtime * frequency) * amplitude * canvas.height / 8;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      ctx.fillStyle = "white";
      ctx.font = "12px Arial";
      ctx.fillText(`${Math.floor(playtime)}s`, 5, 15);
      requestAnimationFrame(drawViz);
    }

    document.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById("viz");
      ctx = canvas.getContext("2d");
      requestAnimationFrame(drawViz);
    });
  </script>
</body>
</html>
