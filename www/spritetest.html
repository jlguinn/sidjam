<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flame Sprite Animation</title>
    <style>
        /* Container for the sprite and row display */
        .sprite-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Container for the sprite */
        .sprite-container {
            width: 102px; /* Initial width of the visible area */
            height: 102px; /* Initial height of the visible area */
            overflow: hidden;
            border: 2px solid #000; /* Optional: for visibility */
            cursor: pointer;
            position: relative; /* Needed for positioning the sprite */
        }

        /* Sprite sheet image */
        .sprite {
            background: url('image/angry_flame_sprite_sheet.png') 0 0 no-repeat;
            transition: background-position 0.1s steps(1); /* Smooth transition for frame changes */
            position: absolute; /* Position relative to the container */
        }

        /* Row number display */
        .row-display {
            font-family: monospace;
            font-size: 16px;
            color: #333;
        }

        /* Main layout container */
        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start; /* Align items at the top */
        }

        /* Styling for controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            width: 100px;
        }
        input[type="range"], input[type="number"] {
            width: 150px;
        }

        /* Styling for JSON output and input */
        .json-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .json-output {
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            font-family: monospace;
            white-space: pre-wrap;
            user-select: all; /* Makes it easy to select and copy */
            min-width: 200px;
            max-width: 300px;
            min-height: 200px; /* Ensure it has some height for visibility */
        }
        .json-input {
            width: 100%;
            height: 100px;
            font-family: monospace;
            resize: vertical;
            padding: 5px;
            border: 1px solid #ccc;
        }
        .apply-button {
            padding: 5px 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .apply-button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="sprite-wrapper">
        <div class="sprite-container" onclick="nextFrame()">
            <div class="sprite" id="flameSprite"></div>
        </div>
        <div class="row-display" id="rowDisplay">Row: 0</div>
    </div>

    <div class="layout">
        <div class="controls">
            <div class="control-group">
                <label>Frame Width:</label>
                <input type="range" id="frameWidth" min="50" max="150" value="102" oninput="updateFrame()">
                <input type="number" id="frameWidthNum" min="50" max="150" value="102" oninput="updateFrame()">
            </div>
            <div class="control-group">
                <label>Frame Height:</label>
                <input type="range" id="frameHeight" min="50" max="150" value="102" oninput="updateFrame()">
                <input type="number" id="frameHeightNum" min="50" max="150" value="102" oninput="updateFrame()">
            </div>
            <div class="control-group">
                <label>Offset X:</label>
                <input type="range" id="offsetX" min="0" max="20" value="2" oninput="updateFrame()">
                <input type="number" id="offsetXNum" min="0" max="20" value="2" oninput="updateFrame()">
            </div>
            <div class="control-group">
                <label>Offset Y:</label>
                <input type="range" id="offsetY" min="0" max="20" value="0" oninput="updateFrame()">
                <input type="number" id="offsetYNum" min="0" max="20" value="0" oninput="updateFrame()">
            </div>
            <div class="control-group">
                <label>Buffer Left:</label>
                <input type="range" id="bufferLeft" min="0" max="20" value="0" oninput="updateFrame()">
                <input type="number" id="bufferLeftNum" min="0" max="20" value="0" oninput="updateFrame()">
            </div>
            <div class="control-group">
                <label>Buffer Right:</label>
                <input type="range" id="bufferRight" min="0" max="20" value="0" oninput="updateFrame()">
                <input type="number" id="bufferRightNum" min="0" max="20" value="0" oninput="updateFrame()">
            </div>
            <div class="control-group">
                <label>Speed (ms):</label>
                <input type="range" id="speed" min="50" max="1000" value="200" oninput="updateSpeed()">
                <input type="number" id="speedNum" min="50" max="1000" value="200" oninput="updateSpeed()">
            </div>
        </div>
        <div class="json-container">
            <div class="json-output" id="jsonOutput"></div>
            <textarea class="json-input" id="jsonInput" placeholder="Paste JSON here to apply settings..."></textarea>
            <button class="apply-button" onclick="applyJsonSettings()">Apply JSON</button>
        </div>
    </div>

    <script>
        const sprite = document.getElementById('flameSprite');
        const spriteContainer = document.querySelector('.sprite-container');
        const jsonOutput = document.getElementById('jsonOutput');
        const jsonInput = document.getElementById('jsonInput');
        const rowDisplay = document.getElementById('rowDisplay');
        let frameIndex = 0;
        let frameWidth = 102; /* Initial width of one frame */
        let frameHeight = 102; /* Initial height of one frame */
        let offsetX = 2; /* Horizontal padding between frames */
        let offsetY = 0; /* Vertical padding between frames */
        let bufferLeft = 0; /* Buffer to extend the left edge of the sprite sheet */
        let bufferRight = 0; /* Buffer to extend the right edge of the sprite sheet */
        let spriteSheetWidth = 512; /* Initial width of the sprite sheet */
        let spriteSheetHeight = 512; /* Initial height of the sprite sheet */
        let framesPerRow = 5; /* Initial number of frames per row */
        let framesPerColumn = 5; /* Initial number of rows */
        let totalFrames = framesPerRow * framesPerColumn; /* Total frames in the sprite sheet */
        let rowBottomYPositions = []; /* Will be calculated if not provided */
        let speed = 200; /* Animation speed in milliseconds */
        let intervalId = null;

        // Calculate default rowBottomYPositions if not provided
        function calculateRowBottomYPositions() {
            const rowHeight = spriteSheetHeight / framesPerColumn;
            return Array.from({ length: framesPerColumn }, (_, i) => (i + 1) * rowHeight);
        }

        // Set initial rowBottomYPositions
        rowBottomYPositions = calculateRowBottomYPositions();

        // Set initial sprite dimensions
        sprite.style.width = `${spriteSheetWidth}px`;
        sprite.style.height = `${spriteSheetHeight}px`;

        // Sync sliders and number inputs
        function syncInputs(input, target) {
            target.value = input.value;
        }

        // Update JSON output
        function updateJsonOutput() {
            const settings = {
                spriteSheetWidth: `${spriteSheetWidth}px`,
                spriteSheetHeight: `${spriteSheetHeight}px`,
                framesPerRow: framesPerRow,
                framesPerColumn: framesPerColumn,
                frameWidth: `${frameWidth}px`,
                frameHeight: `${frameHeight}px`,
                offsetX: `${offsetX}px`,
                offsetY: `${offsetY}px`,
                bufferLeft: `${bufferLeft}px`,
                bufferRight: `${bufferRight}px`,
                rowBottomYPositions: rowBottomYPositions,
                speed: `${speed}ms`
            };
            jsonOutput.textContent = JSON.stringify(settings, null, 2);
        }

        // Apply settings from pasted JSON
        function applyJsonSettings() {
            try {
                const settings = JSON.parse(jsonInput.value);

                // Helper function to parse value and remove unit
                const parseValue = (str, unit) => parseInt(str.replace(unit, ''));

                // Update variables
                spriteSheetWidth = parseValue(settings.spriteSheetWidth, 'px');
                spriteSheetHeight = parseValue(settings.spriteSheetHeight, 'px');
                framesPerRow = parseInt(settings.framesPerRow);
                framesPerColumn = parseInt(settings.framesPerColumn);
                totalFrames = framesPerRow * framesPerColumn; // Recalculate total frames
                frameWidth = parseValue(settings.frameWidth, 'px');
                frameHeight = parseValue(settings.frameHeight, 'px');
                offsetX = parseValue(settings.offsetX, 'px');
                offsetY = parseValue(settings.offsetY, 'px');
                bufferLeft = parseValue(settings.bufferLeft, 'px');
                bufferRight = parseValue(settings.bufferRight, 'px');
                // Use provided rowBottomYPositions if available, otherwise calculate
                rowBottomYPositions = settings.rowBottomYPositions
                    ? settings.rowBottomYPositions.map(Number)
                    : calculateRowBottomYPositions();
                speed = parseValue(settings.speed, 'ms');

                // Update sprite dimensions
                sprite.style.width = `${spriteSheetWidth}px`;
                sprite.style.height = `${spriteSheetHeight}px`;

                // Update sliders and number inputs
                document.getElementById('frameWidth').value = frameWidth;
                document.getElementById('frameWidthNum').value = frameWidth;
                document.getElementById('frameHeight').value = frameHeight;
                document.getElementById('frameHeightNum').value = frameHeight;
                document.getElementById('offsetX').value = offsetX;
                document.getElementById('offsetXNum').value = offsetX;
                document.getElementById('offsetY').value = offsetY;
                document.getElementById('offsetYNum').value = offsetY;
                document.getElementById('bufferLeft').value = bufferLeft;
                document.getElementById('bufferLeftNum').value = bufferLeft;
                document.getElementById('bufferRight').value = bufferRight;
                document.getElementById('bufferRightNum').value = bufferRight;
                document.getElementById('speed').value = speed;
                document.getElementById('speedNum').value = speed;

                // Update animation with new settings
                updateFrame();
                updateSpeed();
            } catch (error) {
                alert('Invalid JSON format. Please check your input.');
                console.error(error);
            }
        }

        // Update frame size and position
        function updateFrame() {
            // Get values from inputs
            frameWidth = parseInt(document.getElementById('frameWidth').value);
            frameHeight = parseInt(document.getElementById('frameHeight').value);
            offsetX = parseInt(document.getElementById('offsetX').value);
            offsetY = parseInt(document.getElementById('offsetY').value);
            bufferLeft = parseInt(document.getElementById('bufferLeft').value);
            bufferRight = parseInt(document.getElementById('bufferRight').value);

            // Sync slider and number inputs
            syncInputs(document.getElementById('frameWidth'), document.getElementById('frameWidthNum'));
            syncInputs(document.getElementById('frameWidthNum'), document.getElementById('frameWidth'));
            syncInputs(document.getElementById('frameHeight'), document.getElementById('frameHeightNum'));
            syncInputs(document.getElementById('frameHeightNum'), document.getElementById('frameHeight'));
            syncInputs(document.getElementById('offsetX'), document.getElementById('offsetXNum'));
            syncInputs(document.getElementById('offsetXNum'), document.getElementById('offsetX'));
            syncInputs(document.getElementById('offsetY'), document.getElementById('offsetYNum'));
            syncInputs(document.getElementById('offsetYNum'), document.getElementById('offsetY'));
            syncInputs(document.getElementById('bufferLeft'), document.getElementById('bufferLeftNum'));
            syncInputs(document.getElementById('bufferLeftNum'), document.getElementById('bufferLeft'));
            syncInputs(document.getElementById('bufferRight'), document.getElementById('bufferRightNum'));
            syncInputs(document.getElementById('bufferRightNum'), document.getElementById('bufferRight'));

            // Update container size (based only on frameWidth and frameHeight)
            spriteContainer.style.width = `${frameWidth}px`;
            spriteContainer.style.height = `${frameHeight}px`;

            // Adjust the sprite position to account for the left buffer
            sprite.style.left = `${-bufferLeft}px`;
            sprite.style.top = `0px`; // No top buffer needed with Y-positions

            // Update frame position
            nextFrame();

            // Update JSON output
            updateJsonOutput();
        }

        // Update animation speed
        function updateSpeed() {
            speed = parseInt(document.getElementById('speed').value);
            syncInputs(document.getElementById('speed'), document.getElementById('speedNum'));
            syncInputs(document.getElementById('speedNum'), document.getElementById('speed'));

            // Restart the interval with the new speed
            clearInterval(intervalId);
            intervalId = setInterval(nextFrame, speed);

            // Update JSON output
            updateJsonOutput();
        }

        function nextFrame() {
            // Calculate the row and column of the current frame
            const row = Math.floor(frameIndex / framesPerRow);
            const col = frameIndex % framesPerRow;

            // Update row display
            rowDisplay.textContent = `Row: ${row}`;

            // Calculate the effective sprite sheet width including buffers (for X-axis)
            const effectiveSpriteSheetWidth = spriteSheetWidth + bufferLeft + bufferRight;
            const effectiveFrameWidth = effectiveSpriteSheetWidth / framesPerRow;

            // Use the rowBottomYPositions to determine the Y-position of the bottom of the current row
            const rowBottomY = rowBottomYPositions[row];
            // Calculate the top Y-position of the current row (top = bottom - frameHeight)
            const rowTopY = rowBottomY - frameHeight;

            // Calculate the position, including offsets
            const posX = -col * (effectiveFrameWidth + offsetX);
            const posY = -rowTopY - offsetY; // Use the calculated top Y-position
            sprite.style.backgroundPosition = `${posX}px ${posY}px`;

            // Move to the next frame, loop back to 0 if at the end
            frameIndex = (frameIndex + 1) % totalFrames;
        }

        // Start the animation
        intervalId = setInterval(nextFrame, speed);

        // Initial update to sync everything
        updateFrame();
        updateSpeed();
    </script>
</body>
</html>
